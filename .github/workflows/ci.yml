name: CI

# 只剩 Swift 一個 job。ASR、講者分離、分析層全部搬進 native/OpenRoomApp 之後，
# 這個 repo 沒有 Python 也沒有前端了，原本的 python / frontend 兩個 job 一起退休。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # native/ 下三個 SPM package 的地板取最高的那個：OpenRoomApp 現在是
    # swift-tools 5.9 + macOS 14（mlx-audio-swift 要求），openroom-diarize 是
    # tools 6.0 + macOS 14。macos-26 附的 Swift 6.x 三個都編得動。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 編不過時第一個要看的東西就是實際 toolchain，先印出來省一輪來回。
      - run: swift --version

      - name: Build SPM packages
        run: |
          set -euo pipefail
          for pkg in OpenRoomApp openroom-capture openroom-diarize; do
            echo "::group::swift build $pkg"
            swift build --package-path "native/$pkg" -c release
            # swift build 對著空的 target 集合也會回 0。要求執行檔真的躺在那裡，
            # 不然 target 改名這種錯會一路綠燈到 release 才爆。
            bin="$(swift build --package-path "native/$pkg" -c release --show-bin-path)"
            test -x "$bin/$pkg" || { echo "::error::$pkg 編完卻沒有 $bin/$pkg"; exit 1; }
            echo "::endgroup::"
          done

      # 移植過來的純邏輯（Analyst 的 JSON 挖取與截斷、簡轉繁、PCM 轉換），加上
      # 歷史紀錄那條路（寫一場會議再從清單讀回來、保留期限的界線）。
      # 不碰模型、不收音、不打網路，所以 CI 跑得動。
      - name: Self-check
        run: |
          set -euo pipefail
          bin="$(swift build --package-path native/OpenRoomApp -c release --show-bin-path)"
          "$bin/OpenRoomApp" --selfcheck
