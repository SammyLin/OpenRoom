[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openroom"
version = "0.1.0"
description = "單機即時會議轉錄工具（Apple Silicon）"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Sammy Lin" }]
dependencies = [
  "zhconv>=1.4",  # 模型吐簡體，使用者讀繁體
]

[project.optional-dependencies]
# 講者分離。torch 一整套很肥，而且模型是 gated repo（要 HF_TOKEN），
# 所以獨立成一個 extra——沒裝也能跑，用 --no-diarize。
diarize = [
  "pyannote.audio>=4.0",
]
# 評測工具鏈。yt-dlp 與 ffmpeg 走 CLI，不進 Python 相依。
eval = [
  "websockets>=12.0",
  "jiwer>=3.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["eval*", "openroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
